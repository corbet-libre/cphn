[package]
name = "cphn"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Single-provider phone verification with opaque dedup and cvld attester binding"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-libre/cphn.git"
readme = "README.md"
include = ["Cargo.toml", "src/**", "README.md", "CHANGELOG.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
cfbk = { git = "https://git.corbet.ch/corbet-libre/cfbk.git", branch = "main" }
http = "1"
url = "2"
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["alloc"] }
phonenumber = "0.3"

[dev-dependencies]
futures = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
